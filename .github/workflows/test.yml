name: Standalone SOCKS5 tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  debian13-one-click:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f tests/debian13.Dockerfile -t sk5-debian13 tests
      - name: Start minimal Debian13
        run: |
          docker run -d --name sk5-debian13 --privileged --cgroupns=host --tmpfs /run --tmpfs /run/lock -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v "$PWD:/source:ro" sk5-debian13
          for attempt in $(seq 1 30); do
            if docker exec sk5-debian13 test -d /run/systemd/system; then break; fi
            sleep 1
          done
          docker exec sk5-debian13 sh -c '! command -v python3'
          docker exec sk5-debian13 sh -c '! command -v curl'
      - name: Install without preinstalled Python or curl
        run: printf '223.5.5.5\n\n\n\nAbcdefGh123456789p\n' | docker exec -i sk5-debian13 bash /source/bootstrap-server.sh
      - name: Verify actual service and account management
        run: docker exec -e GITHUB_ACTIONS=true -e SBM_CI_DISPOSABLE=1 sk5-debian13 python3 /source/tests/smoke_systemd.py --verify-only
      - name: Diagnostics
        if: failure()
        run: docker exec sk5-debian13 journalctl -u sbm-sk5.service -u sbm-sk5-firewall.service -n 60 --no-pager || true
      - name: Remove test container
        if: always()
        run: docker rm -f sk5-debian13 || true
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python build_installer.py --check
      - run: python build_download_entry.py --check
      - run: python -m compileall -q app tests
      - run: bash -n install.sh && bash -n bootstrap.sh && bash -n bootstrap-server.sh && bash -n download.sh
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python tests/build_core.py
        env:
          SBM_BUILD_DIR: ${{ runner.temp }}/sk5-core
      - run: python tests/wire_socks.py -v
  one-click-systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo env GITHUB_ACTIONS=true SBM_CI_DISPOSABLE=1 /usr/bin/python3 tests/smoke_systemd.py
      - run: sudo apt-get install -y nftables
      - run: sudo unshare --net /usr/bin/python3 tests/netns_firewall.py
      - name: Service diagnostics
        if: failure()
        run: sudo journalctl -u sbm-sk5.service -u sbm-sk5-firewall.service -n 60 --no-pager
